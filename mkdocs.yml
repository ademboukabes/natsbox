site_name: "nats-outbox"
site_description: "Transactional Outbox Pattern for PostgreSQL + NATS JetStream"
site_author: "Adem Boukabes"
repo_name: "ademboukabes/natsbox"
repo_url: "https://github.com/ademboukabes/natsbox"

theme:
  name: material
  logo: material/database-sync
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

nav:
  - "Home": index.md
  - "Concepts":
      - "The Outbox Pattern": concepts/outbox-pattern.md
      - "Architecture": concepts/architecture.md
      - "Table Schema": concepts/table-schema.md
  - "How-to Guides":
      - "Integration Guide": guides/integration-guide.md
      - "Alembic Integration": guides/alembic-integration.md
      - "Consumer Deduplication (Inbox)": guides/consumer-deduplication.md
      - "Recovering Dead Letters": guides/recovering-dead-letters.md
      - "Deploying the Relay": guides/deploying-the-relay.md
  - "Operations":
      - "Configuration Reference": operations/configuration-reference.md
      - "Relay Strategies": operations/relay-strategies.md
      - "Monitoring": operations/monitoring.md
  - "API Reference":
      - "Core (Outbox/Inbox)": api/core.md
      - "Relay": api/relay.md
      - "Settings": api/settings.md
