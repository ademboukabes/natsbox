[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nats-outbox"
version = "0.1.0"
description = "Transactional Outbox Pattern for PostgreSQL + NATS JetStream"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["nats", "jetstream", "outbox", "postgresql", "event-driven", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "nats-py>=2.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
metrics = [
    "prometheus-client>=0.20",
]
cli = [
    "typer>=0.12",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]
all = [
    "prometheus-client>=0.20",
    "typer>=0.12",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "docker>=7.0",
    "pytest-timeout>=2.3",
    "typer>=0.12",
    "prometheus-client>=0.20",
    "httpx>=0.27",        # for future FastAPI integration tests
    "fastapi>=0.100.0",   # required for mypy to resolve types in examples
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nats-outbox = "nats_outbox.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nats_outbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 120
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
